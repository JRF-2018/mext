[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mext"
version = "0.6.7"
description = "Make an AI's reading of an argument auditable: transcribe it into Matcha and compute it as default logic (syntax checker, Reiter/prioritized Extensions with Lean proofs, sensitivity analysis, comparison of readings)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "JRF" }]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/JRF-2018/mext"

[project.scripts]
matcha-check = "mext.matcha_check:main"
mext = "mext.core:main"

[tool.setuptools]
packages = ["mext"]
